name: Node CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  validate:
    name: Validação e Tipagem
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código para o runner
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Instalar dependências (caso cache falhe)
        run: npm ci

      - name: Executar Lint
        run: npm run lint

      - name: Verificar Tipos (TypeScript)
        run: npm run type-check

  test-and-build:
    name: Testes Unitários e Build
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código para o runner
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Executar Testes (Vitest)
        run: npm test

      - name: Realizar Build da Aplicação
        run: npm run build
